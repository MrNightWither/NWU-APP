// REGEX PATTERN GENERATOR - Detects Leet-Speak & Variations
// ═══════════════════════════════════════════════════════════════════
function createFilterPattern(word) {
  const charMap = {
    'a': '[a@4äáàâã]',
    'e': '[e3ëéèê€]',
    'i': '[i1!íìîï]',
    'o': '[o0öóòô]',
    'u': '[uüúùû]',
    's': '[s$5ßẞ]',
    'c': '[cč¢]',
    'z': '[zž]',
    'n': '[nñ]'
  };
  
  const pattern = word.split('').map(char => {
    const lower = char.toLowerCase();
    if (charMap[lower]) {
      return charMap[lower] + '[\\s\\*_\\-\\.]*';
    }
    return `[${lower}${lower.toUpperCase()}][\\s\\*_\\-\\.]*`;
  }).join('');
  
  return new RegExp(pattern, 'gi');
}

// ═══════════════════════════════════════════════════════════════════
// XSS PROTECTION - Escapes HTML to prevent code injection
// ═══════════════════════════════════════════════════════════════════
function escapeHTML(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════════════
// RATE LIMITING - Prevents spam (Max 6 messages in 12 seconds)
// ═══════════════════════════════════════════════════════════════════
let messageTimestamps = [];
let recentMessages = []; // Stores recent messages for duplicate detection

function canSendMessage() {
  const now = Date.now();
  // Remove timestamps older than 12 seconds
  messageTimestamps = messageTimestamps.filter(t => now - t < 12000);
  
  if (messageTimestamps.length >= 6) {
    return false; // Rate limit exceeded
  }
  
  messageTimestamps.push(now);
  return true;
}

function isDuplicateMessage(text) {
  const now = Date.now();
  // Remove messages older than 12 seconds
  recentMessages = recentMessages.filter(m => now - m.timestamp < 12000);
  
  // Check if this exact message was sent in the last 12 seconds
  const isDuplicate = recentMessages.some(m => m.text === text);
  
  if (!isDuplicate) {
    // Add this message to recent messages
    recentMessages.push({ text, timestamp: now });
  }
  
  return isDuplicate;
}

function isAdmin(u) {
  return u && (u.role === 'Owner' || u.email?.toLowerCase() === 'nwu.brand@gmail.com');
}
function isGuest(u) { return u && u.role === 'Guest'; }
function canEdit(u) { return u && (u.role === 'Owner' || u.role === 'Moderator' || u.email?.toLowerCase() === 'nwu.brand@gmail.com'); }
function roleColor(role) {
  const map = {Owner:'#9333ea',Moderator:'#3b82f6',VIP:'#f59e0b',Supporter:'#22c55e',User:'#64748b',Guest:'#64748b'};
  return map[role] || '#64748b';
}
function roleMiniIcon(role) {
  if (role === 'Owner') return `<span style="color:#9333ea">${icons.crown}</span>`;
  if (role === 'Moderator') return `<span style="color:#3b82f6">${icons.shield}</span>`;
  if (role === 'VIP') return `<span style="color:#f59e0b">${icons.star}</span>`;
  return `<span style="color:#64748b">${icons.award}</span>`;
}
function getNextStream(schedule) {
  if (!schedule) return 'Kein Plan verfügbar';
  const days = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
  const now = new Date();
  const today = now.getDay();
  for (let i = 0; i < 7; i++) {
    const idx = (today + i) % 7;
    const item = schedule.find(s => s.day === days[idx]);
    const off = !item || !item.time || item.time.toUpperCase().trim() === 'OFF' || item.time.trim() === '';
    if (!off) {
      const t = item.time.split(' - ')[0];
      if (i === 0) {
        try {
          const [h, m] = t.split(':').map(Number);
          const st = new Date(); st.setHours(h, m || 0, 0, 0);
          if (now < st) return `Heute @ ${t} Uhr`;
          continue;
        } catch { continue; }
      }
      return `${i === 1 ? 'Morgen' : days[idx]} @ ${t} Uhr`;
    }
  }
  return 'Momentan kein Stream geplant';
}

}

let faqEditMode = false;
let localFAQ = {};

function renderFAQ() {
  const u = currentUser;
  const isOwner = u.role === 'Owner';
  const faq = faqEditMode ? localFAQ : (metaData?.faq || {});
  
  // Helper to render a collapsible FAQ item
  function faqItem(question, answerKey, defaultAnswer = 'Noch nicht beantwortet') {
    const answer = faq[answerKey] || defaultAnswer;
    if (faqEditMode) {
      return `
        <div class="p-4 bg-white/5 rounded-xl">
          <label class="text-xs font-bold text-white/60 mb-2 block">${question}</label>
          <textarea data-faq-key="${answerKey}" class="w-full bg-black/20 border border-white/10 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-brand-purple resize-y min-h-[60px]">${answer}</textarea>
        </div>
      `;
    }
    
    return `
      <details class="group">
        <summary class="flex items-center justify-between cursor-pointer p-4 bg-white/5 hover:bg-white/10 rounded-xl transition-all list-none">
          <span class="text-sm font-bold text-white/80">${question}</span>
          <span class="text-brand-purple transform group-open:rotate-90 transition-transform">${icons.chevron}</span>
        </summary>
        <div class="mt-2 p-4 bg-black/20 rounded-xl text-sm text-white/60 whitespace-pre-wrap">${escapeHTML(answer)}</div>
      </details>
    `;
  }

  // Category renderer
  function renderCategory(title, icon, items) {
    return `
    <div class="bg-brand-card border border-white/5 rounded-[32px] p-6 md:p-8">

          chatFilterWords[category].splice(idx, 1);
          
          // Remove empty categories
          if (chatFilterWords[category].length === 0) {
            delete chatFilterWords[category];
          }
          
          // Update flat list
          chatFilterWordsList = [];
          Object.values(chatFilterWords).forEach(cat => {

          });

        }
      }
    });
  });

    localFAQ = {};

  });
}

// ─── Chat send ─────────────────────────────────────────────────
async function sendChat() {
  const u = currentUser;
  const msg = document.getElementById('chatInput')?.value?.trim() || chatInput.trim();
  if (!msg) return;
  
  // Check if user is banned
  if (u.isBanned) {
    alert('🚫 Du wurdest gebannt und kannst keine Nachrichten mehr senden.');
    return;
  }
  
  // Rate Limiting: Max 6 messages in 12 seconds (not for Owner/Mod)
  if (u.role !== 'Owner' && u.role !== 'Moderator') {
    if (!canSendMessage()) {
      alert('⏱️ Slow down! Max 6 Nachrichten in 12 Sekunden.');
      return;
    }
    
    // Duplicate Detection: Same message in 12 seconds
    if (isDuplicateMessage(msg)) {
      alert('💜 Einmal reicht zum Lesen');
      return;
    }
  }
  
  // Determine collection based on active tab
  const collectionName = activeTab === 'chat' ? 'chat' : 
                        activeTab === 'ideas' ? 'ideas' : 'podcast';
  
  // Link Detection (only for chat tab, for non-Mod/Owner users)
  if (activeTab === 'chat') {
    const linkRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)|([a-zA-Z0-9-]+\.(com|de|net|org|io|tv|gg)[^\s]*)/gi;
    const hasLink = linkRegex.test(msg);
    
    // Check if user is allowed to post links
    const canPostLinks = u.role === 'Owner' || u.role === 'Moderator';
    
    if (linkFilterEnabled && hasLink && !canPostLinks) {
      alert('❌ Bitte keine Eigenwerbung.');
      return; // Block the message
    }
  }
  
  // Advanced Word Filter with Regex (only for chat tab)
  let filtered = msg;
  if (activeTab === 'chat' && chatFilterEnabled) {
    chatFilterWordsList.forEach(word => {
      const pattern = createFilterPattern(word);
      filtered = filtered.replace(pattern, (match) => '*'.repeat(match.length));
    });
  }
  
  // Send message
  chatInput = '';
  if (document.getElementById('chatInput')) document.getElementById('chatInput').value = '';
  
  // Add message to appropriate collection
  const messageData = {
    userId: u.uid, 
    userName: u.displayName, 
    userRole: u.role,
    text: filtered, 
    timestamp: serverTimestamp(), 
    channel: 'public'
  };
  
  // Add votes field for ideas and podcast
  if (activeTab !== 'chat') {
    messageData.votes = 0;
    messageData.votedBy = [];
  }
  
  await addDoc(collection(db, collectionName), messageData);
}

// ─── Auth actions ──────────────────────────────────────────────
async function handleLogout() {
  if (currentUser?.role === 'Guest') { cleanup(); currentUser = null; render(); return; }
  await signOut(auth);
}
async function handleDeleteAccount() {
  const firebaseUser = auth.currentUser;
  if (!firebaseUser) { if (currentUser?.role === 'Guest') { cleanup(); currentUser = null; render(); } return; }
  isDeleting = true; updateView();
  try {
    try { await deleteDoc(doc(db, 'users', firebaseUser.uid)); } catch {}
    await deleteUser(firebaseUser);
    cleanup(); currentUser = null; render();
  } catch(e) {
    if (e.code === 'auth/requires-recent-login') { alert('Bitte neu einloggen, dann Konto löschen.'); signOut(auth); }
    else alert('Fehler beim Löschen. Bitte erneut versuchen.');
  }
  isDeleting = false;
}

// ─── Joke ──────────────────────────────────────────────────────
function triggerJoke() {
  const msg = JOKE_MESSAGES[Math.floor(Math.random()*JOKE_MESSAGES.length)];
  const el = document.getElementById('jokeOverlay');
  const txt = document.getElementById('jokeText');
  if (!el||!txt) return;
  txt.textContent = msg;
  el.classList.remove('hidden'); el.classList.add('flex');
  if (jokeTimeout) clearTimeout(jokeTimeout);
  jokeTimeout = setTimeout(() => { el.classList.add('hidden'); el.classList.remove('flex'); }, 3000);
}

// ─── Cleanup ───────────────────────────────────────────────────
function cleanup() {
  unsubscribers.forEach(u => u());
  unsubscribers = [];
}

// ─── Realtime Listeners ────────────────────────────────────────
function startListeners() {
  cleanup();
  // Meta
  unsubscribers.push(onSnapshot(doc(db, 'meta', 'nightwither'), snap => {
    if (snap.exists()) { metaData = snap.data(); isLive = !!metaData.isLive; }
    else {
      metaData = { bio:'Willkommen im Herz der NightWitherUnity...', founded:'2023', region:'Nocturnal Sector', schedule:DEFAULT_SCHEDULE, nextStream:'Montag @ 19:00 Uhr', isLive:false, socials:{twitch:'nightwither',discord:'nightwither',tiktok:'nightwither',youtube:'nightwither',instagram:'nightwither',spotify:'nightwither',kick:'nightwither',followers:{twitch:'0',tiktok:'0',youtube:'0',discord:'0',instagram:'0',spotify:'0',kick:'0'}} };
      if (currentUser && isAdmin(currentUser)) setDoc(doc(db,'meta','nightwither'), metaData).catch(()=>{});
    }
    if (['home','schedule','events','about'].includes(activeView)) updateView();
    // update live status indicator in header
    const dot = document.querySelector('.pulse-dot');
    if (dot) dot.className = `w-1 h-1 rounded-full pulse-dot ${isLive?'bg-red-500':'bg-green-400'}`;
  }));
  // Announcements
  unsubscribers.push(onSnapshot(query(collection(db,'announcements'),orderBy('createdAt','desc')), snap => {
    announcements = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (activeView==='events') updateView();
  }));
  // Events
  unsubscribers.push(onSnapshot(query(collection(db,'events'),orderBy('startTime','desc')), snap => {
    events = snap.docs.map(d => ({id:d.id,...d.data()}));
    if (activeView==='events') updateView();
  }));
  // Chat
  unsubscribers.push(onSnapshot(query(collection(db,'chat'),orderBy('timestamp','desc'),limit(50)), snap => {
    chatMessages = snap.docs.map(d => ({id:d.id,...d.data()})).reverse();
    if (activeView==='chat') {
      const cm = document.getElementById('chatMessages');
      if (cm) { cm.innerHTML = renderChat().match(/id="chatMessages"[^>]*>([\s\S]*?)<\/div>\s*<div class="p-4/)?.[1]||''; cm.scrollTop = cm.scrollHeight; }
      updateView();
    }
  }));
  
  // Ideas
  unsubscribers.push(onSnapshot(query(collection(db,'ideas'),orderBy('timestamp','desc'),limit(50)), snap => {
    ideasMessages = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b) => (b.votes||0) - (a.votes||0));
    if (activeView==='chat' && activeTab==='ideas') updateView();
  }));
  
  // Podcast
  unsubscribers.push(onSnapshot(query(collection(db,'podcast'),orderBy('timestamp','desc'),limit(50)), snap => {
    podcastMessages = snap.docs.map(d => ({id:d.id,...d.data()})).sort((a,b) => (b.votes||0) - (a.votes||0));
    if (activeView==='chat' && activeTab==='podcast') updateView();
  }));
  
  // Community users (only for admins)
  if (currentUser && isAdmin(currentUser)) {
    unsubscribers.push(onSnapshot(query(collection(db,'users'),orderBy('displayName','asc')), snap => {
      communityUsers = snap.docs.map(d => ({uid:d.id,...d.data()}));
      if (activeView==='community') updateView();
    }));
  }
}

// ─── Auth State ────────────────────────────────────────────────
onAuthStateChanged(auth, async firebaseUser => {
  cleanup();
  if (firebaseUser) {
    const userRef = doc(db, 'users', firebaseUser.uid);
    unsubscribers.push(onSnapshot(userRef, async snap => {
      if (snap.exists()) {
        const data = snap.data();
        const isAdm = firebaseUser.email?.toLowerCase() === 'nwu.brand@gmail.com';
        const updates = {};
        if (!data.email || data.email !== firebaseUser.email) updates.email = firebaseUser.email||'';
        if (isAdm && data.role !== 'Owner') updates.role = 'Owner';
        if (Object.keys(updates).length > 0) await updateDoc(userRef, updates);
        currentUser = {...data,...updates, email: firebaseUser.email||data.email||''};
      } else {
        const isAdm = firebaseUser.email?.toLowerCase() === 'nwu.brand@gmail.com';
        const newUser = { uid:firebaseUser.uid, email:firebaseUser.email||'', displayName:firebaseUser.displayName||(isAdm?'Admin':'User_'+firebaseUser.uid.slice(0,5)), photoURL:firebaseUser.photoURL||'', role:isAdm?'Owner':'User', loyaltyPoints:0, hoursWatched:0, displayNameChanges:0 };
        await setDoc(userRef, newUser);
        currentUser = newUser;
      }
      startListeners();
      render();
    }));
  } else {
    if (!currentUser || currentUser.role !== 'Guest') {
      currentUser = null;
      render();
    }
  }
});
